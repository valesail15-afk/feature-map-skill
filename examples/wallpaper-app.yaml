# 功能地图 · 壁纸推荐精选（com.hm.bztjjx v1.0.0）
#
# 取证方式：APK 资源/Manifest 静态分析 + Android 11 模拟器实跑（截图 + 无障碍节点树）
# 取证日期：2026-11-18
#
# 本文件是「壁纸推荐精选」的完整真实地图，仅作为参考示例保留，不是技能内置数据源。
# 使用时复制到目标项目根目录并改名为 feature-map.yaml：
#   copy examples\wallpaper-app.yaml <项目根目录>\feature-map.yaml
#
# 字段：
#   name    : 功能名称，取 App 中实际出现的名称（必填）
#   aliases : 常见别名/用户可能的叫法（可选，列表）
#   where   : 功能在界面上的层级位置，用 " > " 分隔（必填）
#   how     : 怎么打开，按点击顺序写，用 " > " 分隔（必填）
#
# 手改本文件即可生效。

features:
  - name: 发现（首页）
    aliases: [首页, 发现, 主页, 推荐]
    where: 底部导航 > 发现
    how: 打开 App > 点底部「发现」

  - name: 搜索壁纸
    aliases: [搜索, 搜壁纸, 搜索框, 找壁纸, 查找壁纸]
    where: 发现（首页）> 搜索壁纸、风格或标签
    how: 发现页点顶部搜索框 > 输入关键词 > 回车

  - name: 热搜榜
    aliases: [热搜, 热门搜索, 排行榜, 热搜词]
    where: 搜索页 > 热搜榜
    how: 发现页点搜索框 > 在「热搜榜」点热搜词

  - name: 分类
    aliases: [分类, 发现风格, 风格分类, 壁纸分类]
    where: 底部导航 > 分类
    how: 点底部「分类」> 左右滑动风格标签

  - name: 壁纸类型筛选
    aliases: [全部, 静态, 动态, 空间, 筛选, 壁纸类型]
    where: 分类 > 类型筛选（全部 / 静态 / 动态 / 空间）
    how: 点底部「分类」> 点「全部 / 静态 / 动态 / 空间」

  - name: 壁纸排序
    aliases: [排序, 最热, 最新, 下载榜, 点赞榜]
    where: 分类 > 排序（最热 / 最新 / 下载 / 点赞）
    how: 点底部「分类」> 在「排序」行点最热/最新/下载/点赞

  - name: 精选（沉浸精选）
    aliases: [精选, 沉浸精选, 沉浸, 精选壁纸]
    where: 底部导航 > 精选
    how: 点底部「精选」> 上下滑切换壁纸

  - name: 壁纸详情
    aliases: [详情, 壁纸预览, 看详情, 大图, 壁纸大图]
    where: 任意壁纸卡片 > 详情页
    how: 发现/分类页点壁纸卡片；精选页点左下「看详情」

  - name: 设为壁纸
    aliases: [设置壁纸, 换壁纸, 设为桌面, 设为锁屏, 应用壁纸]
    where: 壁纸详情 > 设为壁纸
    how: 打开壁纸详情 > 点「设为壁纸」> 选桌面/锁屏/桌面与锁屏同时设置

  - name: 保存到相册
    aliases: [保存相册, 原图保存, 保存到本地, 存图]
    where: 壁纸详情 > 设为壁纸 > 保存到相册
    how: 打开壁纸详情 > 点「设为壁纸」> 点最下方「保存到相册」

  - name: 下载壁纸
    aliases: [下载, 下载原图, 保存壁纸, 2K下载]
    where: 壁纸详情 > 下载
    how: 打开壁纸详情 > 点「下载」

  - name: 收藏壁纸
    aliases: [收藏, 喜欢, 收藏壁纸, 加到收藏]
    where: 壁纸详情 > 收藏；精选页右侧「收藏」
    how: 打开壁纸详情 > 点「收藏」

  - name: 点赞
    aliases: [点赞, 喜欢, 红心, 赞]
    where: 壁纸详情 > 点赞
    how: 打开壁纸详情 > 点「点赞」

  - name: 分享壁纸
    aliases: [分享, 发给好友, 系统分享]
    where: 壁纸详情 > 分享；或详情右上角分享图标
    how: 打开壁纸详情 > 点「分享」> 选择应用

  - name: 我的
    aliases: [我的, 个人中心, 个人页]
    where: 底部导航 > 我的
    how: 点底部「我的」

  - name: 我的收藏
    aliases: [收藏夹, 我的收藏, 收藏列表]
    where: 我的 > 我的收藏
    how: 点「我的」>「我的收藏」（精选页顶部「收藏」也可直达）

  - name: 浏览足迹
    aliases: [浏览历史, 历史, 足迹, 看过]
    where: 我的 > 浏览历史
    how: 点「我的」>「浏览历史」

  - name: 生成记录
    aliases: [生成记录, AI生成记录]
    where: 我的 > 生成记录
    how: 点「我的」>「生成记录」

  - name: AI 壁纸工坊
    aliases: [AI, AI生成, AI壁纸, 生成壁纸, AI画壁纸]
    where: 底部导航 > AI
    how: 点底部中间「AI」> 输入画面描述 > 点「立即生成壁纸」

  - name: 开通会员（我的会员）
    aliases: [会员, VIP, 升级Pro, 充值, 我的会员, 开通VIP]
    where: 我的 > 开通会员；首页右上角「升级 Pro」
    how: 点「我的」> 点「立即开通」；或首页点「升级 Pro」

  - name: 订阅管理
    aliases: [订阅, 自动续费, 我的订阅]
    where: 我的 > 订阅管理
    how: 点「我的」>「订阅管理」

  - name: 站内通知
    aliases: [通知, 消息, 通知中心]
    where: 我的 > 站内通知
    how: 点「我的」>「站内通知」

  - name: 投诉举报
    aliases: [举报, 投诉, 反馈, 意见反馈]
    where: 我的 > 举报投诉
    how: 点「我的」>「举报投诉」> 填写内容 > 提交

  - name: 联系客服
    aliases: [客服, 联系我们, 客服电话, 客服邮箱]
    where: 我的 > 联系客服
    how: 点「我的」>「联系客服」

  - name: 通用设置
    aliases: [设置, 设置页, 偏好设置]
    where: 我的 > 右上角设置图标
    how: 点「我的」> 点右上角齿轮

  - name: 清除图片缓存
    aliases: [清缓存, 清除缓存, 清理空间, 释放空间]
    where: 通用设置 > 下载与画质 > 清除图片缓存
    how: 点「我的」> 齿轮 > 点「清除图片缓存」

  - name: 每日自动换壁纸
    aliases: [自动换壁纸, 壁纸轮换, 每日壁纸]
    where: 通用设置 > 桌面体验 > 每日自动换壁纸
    how: 点「我的」> 齿轮 > 打开「每日自动换壁纸」开关
