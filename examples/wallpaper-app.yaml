# 功能地图 · 壁纸推荐精选（com.hm.bztjjx v1.0.0）
#
# 取证方式：真机 vivo V2166A / Android 12 实测（截图 + 无障碍节点树），2026-11-19 复测
# 本文件是参考示例，不是技能内置数据源。使用时复制到项目根目录并改名为 feature-map.yaml。
app:
  package: com.hm.bztjjx
  version: 1.0.0
features:
- name: 发现（首页）
  aliases: [首页, 发现, 主页, 推荐]
  where: 底部导航 > 发现
  how: 打开 App > 点底部「发现」
- name: AI 搜图
  aliases: [AI搜图, 搜图]
  where: 发现（首页）> 搜索框右侧「AI 搜图」
  how: 发现页点搜索框右侧「AI 搜图」
- name: 搜索壁纸
  aliases: [搜索, 搜壁纸, 搜索框, 找壁纸]
  where: 发现（首页）> 搜索壁纸、风格或标签
  how: 发现页点顶部搜索框 > 输入关键词 > 回车
- name: 升级 Pro
  aliases: [Pro, 升级会员, 会员入口]
  where: 发现（首页）> 右上角「升级 Pro」
  how: 发现页点右上角「升级 Pro」> 进入会员页
- name: 首屏精选
  aliases: [首屏, 精选区块]
  where: 发现（首页）> 首屏精选 / 动效壁纸
  how: 发现页在「首屏精选」区点「全部」或壁纸卡片
- name: 空间壁纸
  aliases: [空间, 立体壁纸, 陀螺仪壁纸]
  where: 发现（首页）> 酷壁精选 > 空间壁纸
  how: 发现页点「空间壁纸」横幅 > 点「立即体验」
- name: 分类
  aliases: [发现风格, 风格分类, 壁纸分类]
  where: 底部导航 > 分类
  how: 点底部「分类」> 左右滑动风格标签
- name: 壁纸类型筛选
  aliases: [全部, 静态, 动态, 空间, 筛选, 壁纸类型]
  where: 分类 > 类型筛选（全部 / 静态 / 动态 / 空间）
  how: 点底部「分类」> 点「全部 / 静态 / 动态 / 空间」
- name: 壁纸排序
  aliases: [排序, 最热, 最新, 下载榜, 点赞榜]
  where: 分类 > 排序（最热 / 最新 / 下载 / 点赞）
  how: 点底部「分类」> 在「排序」行点最热/最新/下载/点赞
- name: 风格标签
  aliases: [风格, 抽象, 暗黑, 动物, 动漫, 美女]
  where: 分类 > 风格标签行
  how: 点底部「分类」> 点左右滑动的风格标签
- name: AI 壁纸工坊
  aliases: [AI, AI生成, AI壁纸, 生成壁纸]
  where: 底部导航 > AI
  how: 点底部中间「AI」> 输入画面描述 > 生成
- name: 描述画面
  aliases: [画面描述, 提示词, 描述]
  where: AI 壁纸工坊 > 描述画面
  how: 点底部「AI」> 在「描述画面」输入内容
- name: 换个灵感
  aliases: [灵感, 换灵感]
  where: AI 壁纸工坊 > 换个灵感
  how: 点底部「AI」> 点「换个灵感」自动填入描述
- name: 生成风格
  aliases: [风格, 自定义风格]
  where: AI 壁纸工坊 > 风格
  how: 点底部「AI」> 点「风格」选择或自定义
- name: 精选（沉浸精选）
  aliases: [精选, 沉浸精选, 沉浸]
  where: 底部导航 > 精选
  how: 点底部「精选」> 上下滑切换壁纸
- name: 壁纸详情
  aliases: [详情, 壁纸预览, 看详情, 大图]
  where: 任意壁纸卡片 > 详情页
  how: 发现/分类页点壁纸卡片；精选页点左下「看详情」
- name: 设为壁纸
  aliases: [设置壁纸, 换壁纸, 设为桌面, 设为锁屏, 应用壁纸]
  where: 壁纸详情 > 设为壁纸
  how: 打开壁纸详情 > 点「设为壁纸」> 按类型选择（动态壁纸会跳系统确认）
- name: 设为动态壁纸
  aliases: [动态壁纸, 主屏幕生效]
  where: 壁纸详情 > 设为壁纸 > 设为动态壁纸
  how: 打开动态壁纸详情 > 点「设为壁纸」> 点「设为动态壁纸」> 在系统确认框点「设置壁纸」
- name: 保存到相册
  aliases: [保存相册, 原图保存, 存储]
  where: 壁纸详情 > 设为壁纸 > 保存到相册
  how: 打开壁纸详情 > 点「设为壁纸」> 点「保存到相册」
- name: 下载壁纸
  aliases: [下载, 下载原图, 保存壁纸, 2K下载]
  where: 壁纸详情 > 下载
  how: 打开壁纸详情 > 点「下载」
- name: 收藏壁纸
  aliases: [收藏, 收藏壁纸]
  where: 壁纸详情 > 收藏
  how: 打开壁纸详情 > 点「收藏」
- name: 点赞
  aliases: [点赞, 红心, 赞]
  where: 壁纸详情 > 点赞
  how: 打开壁纸详情 > 点「点赞」
- name: 分享壁纸
  aliases: [分享, 发给好友, 系统分享]
  where: 壁纸详情 > 分享 / 右上角分享图标
  how: 打开壁纸详情 > 点「分享」> 选择应用
