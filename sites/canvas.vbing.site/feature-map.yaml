# 功能地图 · 连镜（https://canvas.vbing.site/）
#
# 取证方式：Chrome 实际登录后逐页访问 + 点击展开菜单（Playwright），截图与页面文案为准
# 取证日期：2026-11-19
# 备注：左侧「探索」目前提示「即将上线」，不可用；直接访问 /assets 会被 nginx 403，
#       需从左侧导航点「资产」进入（前端路由）。
#
# 字段：name 功能名称 / aliases 别名 / where 位置 / how 打开步骤

features:
  - name: 创作（首页）
    aliases: [首页, 创作, 主页, 回到首页]
    where: 左侧导航 > 创作
    how: 点左侧「创作」，或点左上角「连镜」Logo

  - name: 探索
    aliases: [探索页, 发现]
    where: 左侧导航 > 探索
    how: 点左侧「探索」；当前悬停提示「即将上线」，暂不可用

  - name: 资产
    aliases: [资产页]
    where: 左侧导航 > 资产
    how: 点左侧「资产」（不要直接改地址栏访问 /assets，会被 403）

  - name: 短剧工作室
    aliases: [短剧]
    where: 左侧导航 > 短剧工作室
    how: 点左侧「短剧工作室」

  - name: 营销工作室
    aliases: [营销]
    where: 左侧导航 > 营销工作室
    how: 点左侧「营销工作室」

  - name: 我的作品
    aliases: [作品, 全部作品, 项目列表]
    where: 左侧导航 > 画布分组 > 全部
    how: 点左侧「画布」下的「全部」，进入我的作品页

  - name: 新对话
    aliases: [新建对话]
    where: 左侧导航 > 对话分组右侧「+」
    how: 点「对话」右侧的「+」新建对话

  - name: 侧边栏收起展开
    aliases: [收起侧边栏, 展开侧边栏, Toggle Sidebar, 折叠侧栏]
    where: 页面顶部左侧「Toggle Sidebar」/ 左下角箭头
    how: 点顶部「Toggle Sidebar」，或点左下角昵称旁的箭头

  - name: 账户菜单
    aliases: [账户, 用户菜单, 个人菜单]
    where: 左下角头像与昵称「valesail」
    how: 点左下角头像/昵称，展开账户菜单

  - name: 个人中心
    aliases: [个人主页, 我的]
    where: 账户菜单 > 个人中心
    how: 点左下角头像 > 点「个人中心」（地址 /profile）

  - name: 退出登录
    aliases: [登出, 退出账号]
    where: 账户菜单 > 退出登录
    how: 点左下角头像 > 点「退出登录」

  - name: 积分商城
    aliases: [充值, 买积分, 购买积分]
    where: 右上角积分按钮（带「+」）
    how: 点右上角积分按钮 > 打开积分商城，选套餐后点「立即支付」

  - name: 公告栏
    aliases: [通知条, 公告]
    where: 页面顶部横向提示条
    how: 页面顶部提示条内查看，点右侧「×」关闭

  - name: 图片生成
    aliases: [文生图, 图片模式]
    where: 创作页 > 模式/模型菜单 > 图片生成
    how: 点输入框下方模型按钮 > 选「图片生成」（直接出图，适合角色设定、场景、海报）

  - name: 视频生成
    aliases: [文生视频, 图生视频, 视频模式]
    where: 创作页 > 模式/模型菜单 > 视频生成
    how: 点输入框下方模型按钮 > 选「视频生成」（文生视频或用参考图生成镜头）

  - name: 音频生成
    aliases: [配音, 音效, 配乐, 音频模式]
    where: 创作页 > 模式/模型菜单 > 音频生成
    how: 点输入框下方模型按钮 > 选「音频生成」（配音、音效和配乐）

  - name: 模型切换
    aliases: [切换模型, 选择模型, 模型]
    where: 创作页 > 输入框下方模型按钮（如 gpt-image-2.5 / seedance-2.0-1 / seed-audio-1.0）
    how: 点模型按钮展开模型列表 > 选一个模型

  - name: 图片参数
    aliases: [图片比例, 清晰度, 生成数量]
    where: 创作页 > 输入框下方「16:9 · 1K · 1张」
    how: 点参数按钮 > 选比例（Auto/1:1/16:9/9:16/4:3/3:4）、清晰度（1K/2K/4K）、生成数量（1/2/4 张）

  - name: 视频参数
    aliases: [视频比例, 视频时长, 生成音频, 视频清晰度]
    where: 创作页 > 视频生成 > 参数按钮「文生视频 · Auto · 720P · 5秒 · 生成音频开 · 1个」
    how: 点参数按钮 > 选文生视频/图生视频、比例、清晰度、时长（5–15 秒）、生成音频开/关、生成数量

  - name: 音频模型
    aliases: [seed-audio-1.0, 音频模型切换]
    where: 创作页 > 音频生成 > 模型按钮
    how: 切到「音频生成」> 点模型按钮 > 选 seed-audio-1.0（130 积分）

  - name: 创作目标切换
    aliases: [创作类型切换, 生成画布短剧营销]
    where: 创作页 > 输入框上方「生成 / 画布 / 短剧 / 营销」
    how: 点输入框上方的目标标签切换创作目标

  - name: 提示词输入框
    aliases: [提示词, 描述画面, 输入提示词]
    where: 创作页 > 输入框「描述你想生成的画面、镜头或声音，也可以上传、粘贴参考图」
    how: 点输入框直接输入；引用画布素材时输入 @

  - name: 上传参考图
    aliases: [参考图, 上传图片, 粘贴参考图]
    where: 创作页 > 提示词输入框区域
    how: 在输入框区域上传参考图，或直接 Ctrl+V 粘贴图片

  - name: 生成按钮
    aliases: [开始生成, 立即生成]
    where: 创作页 > 输入框右侧「生成」
    how: 输入提示词后点「生成」

  - name: 新建画布
    aliases: [创建画布]
    where: 首页「画布」分组 / 我的作品页 / 画布菜单
    how: 首页输入框上方点「画布」>「新建画布」；或我的作品页点「新建画布」；或画布菜单 >「新建画布」

  - name: 新建短剧
    aliases: [创建短剧]
    where: 首页输入框上方「短剧」
    how: 点「短剧」> 点「新建短剧」

  - name: 新建营销片
    aliases: [创建营销片]
    where: 首页输入框上方「营销」
    how: 点「营销」> 点「新建营销片」

  - name: 生成历史
    aliases: [历史, 生成记录]
    where: 资产 > 生成历史
    how: 左侧点「资产」> 点「生成历史」

  - name: 个人资产库
    aliases: [资产库, 我的素材]
    where: 资产 > 个人资产库
    how: 左侧点「资产」> 点「个人资产库」

  - name: 资产类型筛选
    aliases: [图片筛选, 视频筛选, 音频筛选, 类型筛选]
    where: 资产 > 生成历史 > 图片 / 视频 / 音频
    how: 在生成历史点「图片」「视频」或「音频」筛选

  - name: 资产来源筛选
    aliases: [来源筛选]
    where: 资产 > 生成历史 > 来源
    how: 点「来源」> 选全部来源 / 首页对话 / 某张画布

  - name: 资产时间筛选
    aliases: [时间筛选]
    where: 资产 > 生成历史 > 时间
    how: 点「时间」> 选全部时间 / 今天 / 近 7 天 / 近 30 天

  - name: 资产排序
    aliases: [排序]
    where: 资产 > 生成历史 > 排序
    how: 点「排序」> 选最新优先 / 最早优先

  - name: 资产搜索
    aliases: [搜索素材, 搜索文件名]
    where: 资产 > 个人资产库 > 搜索文件名
    how: 在个人资产库右上角搜索框输入文件名

  - name: 新建文件夹
    aliases: [资产文件夹]
    where: 资产 > 个人资产库 > 新建
    how: 点「新建」> 选「新建文件夹」

  - name: 上传资产
    aliases: [上传素材到资产库]
    where: 资产 > 个人资产库 > 新建
    how: 点「新建」> 选「上传资产」，或把文件拖到页面

  - name: 上传剧本/小说
    aliases: [剧本上传, 上传剧本, 上传小说]
    where: 短剧工作室 > 上传剧本 / 小说
    how: 短剧工作室 > 点「上传剧本 / 小说」> 选择文件（txt · md · docx，500 万字以内）

  - name: 粘贴正文
    aliases: [粘贴剧本, 粘贴小说]
    where: 短剧工作室 > 粘贴正文
    how: 短剧工作室 > 点「粘贴正文」> 粘贴剧本正文 > 点右下角发送

  - name: 我的短剧
    aliases: [短剧列表]
    where: 短剧工作室 > 我的短剧
    how: 短剧工作室页面向下滚动到「我的短剧」

  - name: 商品图上传
    aliases: [商品图, 上传商品]
    where: 营销工作室 > 商品
    how: 营销工作室 > 点「商品」上传商品图

  - name: 模特图上传
    aliases: [模特图, 上传模特]
    where: 营销工作室 > 模特
    how: 营销工作室 > 点「模特」上传模特图

  - name: 参考素材
    aliases: [参考图上传, 参考素材上传]
    where: 营销工作室 > 参考
    how: 营销工作室 > 点「参考」上传参考图/参考音频

  - name: 营销文案
    aliases: [商品卖点, 营销提示词]
    where: 营销工作室 > 输入框「商品名、卖点、想要的感觉，也可以不写」
    how: 在营销工作室输入框写商品名、卖点与想要的感觉

  - name: 平台风格
    aliases: [抖音, 小红书, 淘宝天猫, TikTok, Instagram Reels, 通用]
    where: 营销工作室 > 平台选择器（默认「抖音」）
    how: 点「抖音」> 选抖音 / 小红书 / 淘宝天猫 / TikTok / Instagram Reels / 通用

  - name: 营销角度
    aliases: [内置角度, 自动角度, 痛点-解决, 卖点拆解, 生活方式种草, 前后对比, 开箱体验, 质感大片]
    where: 营销工作室 > 角度选择器（默认「自动 ×2」）
    how: 点「自动 ×2」> 选自动，或选 1–4 个数量，或选内置角度（痛点-解决/卖点拆解/生活方式种草/前后对比/开箱体验/质感大片）

  - name: 营销模型
    aliases: [营销模型切换]
    where: 营销工作室 > 模型按钮（默认 seedance-2.0-2）
    how: 点模型按钮 > 选 seedance-2.0-1 / seedance-2.0-2 / MiniMax-H3

  - name: 营销参数
    aliases: [画幅, 旁白语言, 写脚本的文本模型, 营销分辨率]
    where: 营销工作室 > 参数按钮「9:16 · 720P · 15s · 中」
    how: 点参数按钮 > 选画幅、分辨率、时长、旁白语言（中文/English）、写脚本的文本模型

  - name: 我的营销片
    aliases: [营销片列表]
    where: 营销工作室 > 我的营销片
    how: 营销工作室页面向下滚动到「我的营销片」

  - name: 作品筛选
    aliases: [个人画布, 个人短剧, 个人营销片]
    where: 我的作品 > 全部 / 个人画布 / 个人短剧 / 个人营销片
    how: 我的作品页点标签切换作品类型

  - name: 导入画布
    aliases: [导入项目]
    where: 我的作品 > 导入画布
    how: 我的作品页点「导入画布」

  - name: 添加节点
    aliases: [节点菜单, 新增节点]
    where: 画布编辑器 > 左侧「添加节点」
    how: 打开画布 > 点左侧「添加节点」> 选图片生成 / 视频生成 / 文本 / 音频 / 导演台 / 角色卡 / 分镜表 / 上传素材 / 从资产库添加

  - name: 画布菜单
    aliases: [返回项目列表]
    where: 画布编辑器 > 左上角「画布菜单」
    how: 打开画布 > 点左上角「画布菜单」

  - name: 导出画布
    aliases: [导出项目]
    where: 画布编辑器 > 画布菜单 > 导出画布
    how: 打开画布 > 点左上角「画布菜单」> 点「导出画布」

  - name: 画布设置
    aliases: [主题, 更多菜单, 画布主题]
    where: 画布编辑器 > 右上角「更多」
    how: 打开画布 > 点右上角「更多」> 选画布设置 / 快捷键 / 主题

  - name: 任务历史
    aliases: [画布任务历史]
    where: 画布编辑器 > 左侧工具栏「任务历史」
    how: 打开画布 > 点左侧「任务历史」查看这张画布的生成记录

  - name: 画布素材库
    aliases: [素材库]
    where: 画布编辑器 > 左侧「素材库」
    how: 打开画布 > 点「素材库」> 切个人资产库 / 生成历史，或点「上传」

  - name: 上传素材
    aliases: [画布上传]
    where: 画布编辑器 > 左侧「上传」
    how: 打开画布 > 点左侧「上传」选文件

  - name: 缩放
    aliases: [画布缩放]
    where: 画布编辑器 > 左下角「缩放」
    how: 打开画布 > 点左下角缩放比例调整

  - name: 小地图
    aliases: [缩略图]
    where: 画布编辑器 > 左下角「小地图」
    how: 打开画布 > 点左下角「小地图」开关

  - name: 快捷键
    aliases: [快捷键盘]
    where: 画布编辑器 > 右上角「更多」> 快捷键
    how: 打开画布 > 点右上角「更多」>「快捷键」，或按 ?

  - name: 小镜
    aliases: [AI 助手, 小镜助手]
    where: 画布编辑器 > 右下角「小镜」
    how: 打开画布 > 点右下角「小镜」唤起 AI 助手

  - name: 画布背景
    aliases: [点阵背景, 无背景]
    where: 画布编辑器 > 左下角「点阵背景」/「无背景」
    how: 打开画布 > 点左下角「点阵背景」或「无背景」切换

  - name: 撤销重做
    aliases: [撤销, 重做]
    where: 画布编辑器 > 左侧「撤销」「重做」
    how: 打开画布 > 点左侧撤销/重做按钮，或按 Ctrl+Z / Shift+Ctrl+Z

  - name: 选择抓手工具
    aliases: [选择工具, 抓手]
    where: 画布编辑器 > 左侧「选择」「抓手」
    how: 打开画布 > 点左侧「选择」（V）或「抓手」（H）；按住空格临时抓手

  - name: 概览
    aliases: [个人概览, 数据概览]
    where: 个人中心 > 概览
    how: 账户菜单 > 个人中心 > 点「概览」

  - name: 积分
    aliases: [我的积分, 积分余额]
    where: 个人中心 > 积分
    how: 账户菜单 > 个人中心 > 点「积分」，查看可用/余额/冻结积分

  - name: 充值积分
    aliases: [积分充值]
    where: 个人中心 > 积分 > 充值积分
    how: 个人中心 > 积分 > 点「充值积分」进入积分商城

  - name: 积分流水
    aliases: [积分记录, 流水]
    where: 个人中心 > 积分 > 积分流水
    how: 个人中心 > 积分 > 下方的积分流水列表；用上方筛选切换生成任务/管理员调整/充值/初始积分/注册赠送

  - name: 资料
    aliases: [个人资料, 编辑资料]
    where: 个人中心 > 资料
    how: 账户菜单 > 个人中心 > 点「资料」，可改昵称并保存

  - name: 上传头像
    aliases: [头像]
    where: 个人中心 > 资料 > 上传新头像
    how: 个人中心 > 资料 > 点「上传新头像」，或把图片拖到上传区

  - name: 修改密码
    aliases: [密码, 安全设置]
    where: 个人中心 > 安全
    how: 账户菜单 > 个人中心 > 点「安全」> 填当前密码、新密码、确认新密码 > 点「修改密码」

  - name: 登录
    aliases: [登陆, 登录账号]
    where: 未登录时的登录页 / 右上角「登录」
    how: 点右上角「登录」> 填用户名、密码 > 点「登录」

  - name: 注册
    aliases: [免费注册, 注册账号]
    where: 登录页 > 免费注册 / 注册
    how: 点右上角「免费注册」或登录面板的「注册」，按页面提示创建账号
