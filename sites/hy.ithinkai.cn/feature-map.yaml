# 功能地图 · 红鸦 AI（https://hy.ithinkai.cn/）
#
# 取证方式：Chrome 实际登录（微信扫码）后逐页访问，读取页面文案与导航结构
# 取证日期：2026-11-18
# 备注：左侧导航在登录后展开；未登录时只能看到营销首页与登录入口。
#
# 字段：name 功能名称 / aliases 别名 / where 位置 / how 打开步骤

features:
  - name: 创作中心
    aliases: [首页, 创作, 图文生成, 小红书图文, 主页面]
    where: 左侧导航 > 创作中心
    how: 登录后点左侧「创作中心」

  - name: 链接/口令解析
    aliases: [链接解析, 口令解析, 分享链接, 粘贴链接, 解析]
    where: 创作中心 > 顶部输入框「小红书 / 公众号 / 抖音 / 快手 / B站 链接，或整段分享口令」
    how: 在创作中心顶部输入框粘贴链接或口令 > 点右侧「解析」

  - name: 主题生成图文
    aliases: [主题创作, 一句话生成, 输入主题, 文字生成图文]
    where: 创作中心 > 第二个输入框（提示示例：云南3天2夜旅游攻略…）
    how: 在创作中心输入主题描述 > 点右下角发送按钮

  - name: 创作模式切换
    aliases: [普通图文, 实况图文, 商品图文, 爆文复刻, 创作模式]
    where: 创作中心 > 输入框下方「普通图文」下拉
    how: 点「普通图文」> 选普通图文 / 实况图文 / 商品图文 / 爆文复刻

  - name: 图片模型切换
    aliases: [图片模型, 模型, image-G2, image-N2, 高清模型]
    where: 创作中心 > 「image-G2（3积分/图）」下拉
    how: 点模型名 > 选 image-G2 / image-N2 / image-G2.5-Flare / image-N2.1

  - name: 创作设置
    aliases: [分步创作, 一步出图, 生成篇数, 篇数, 整套样式]
    where: 创作中心 > 「创作设置」
    how: 点「创作设置」> 选分步创作/一步出图、生成篇数、整套样式 > 确认使用

  - name: 资料与素材
    aliases: [关联知识库, 素材, 画面素材, 产品图库, 网上找图]
    where: 创作中心 > 「资料与素材」
    how: 点「资料与素材」> 关联知识库、选画面素材来源 > 确认关联

  - name: 我的创作
    aliases: [历史, 我的作品, 作品列表, 草稿箱]
    where: 左侧导航 > 我的创作
    how: 点左侧「我的创作」> 切换 全部作品 / 已完成 / 草稿箱

  - name: 新建图文
    aliases: [新建, 新建作品, 开始创作]
    where: 我的创作 > 右上角「新建图文」
    how: 点左侧「我的创作」> 点「新建图文」> 回到创作中心

  - name: 产品档案
    aliases: [产品库, 商品档案, 产品信息, 商品资料]
    where: 我的创作 > 产品档案
    how: 点左侧「我的创作」> 点「产品档案」

  - name: 我的知识库
    aliases: [知识库, 资料库, 品牌知识库]
    where: 我的创作 > 我的知识库
    how: 点左侧「我的创作」> 点「我的知识库」

  - name: 自定义词库
